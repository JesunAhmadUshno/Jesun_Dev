# Daily rebuild (file name kept for history) so GitHub numbers stay true without anyone touching the site.
name: weekly-fresh
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter fonts-dejavu-core && fc-cache -f
      - run: npm ci || npm install
      - run: node scripts/github-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/sync-github.mjs
      - run: npm run build && npm run lint && npm test && npm run score
      - name: Commit refreshed numbers to a branch for review
        run: |
          git config user.name "site-build"
          git config user.email "site-build@users.noreply.github.com"
          git checkout -B fresh/github-stats
          git add src/data/jesun.json src/data/github-record.json SEO-AEO-GEO-SCORECARD.md build-log
          git diff --cached --quiet || git commit -m "Weekly fresh: GitHub stats and study verdicts"
          git push -f origin fresh/github-stats
      # Deploy is intentionally absent. Merge the branch to publish, by Jesun's decision.
