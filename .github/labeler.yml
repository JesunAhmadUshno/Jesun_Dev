site:
  - changed-files:
      - any-glob-to-any-file: ["*.html", "**/*.html", "css/**", "js/**", "assets/**", "images/**", "img/**"]
source:
  - changed-files:
      - any-glob-to-any-file: ["source/**"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["README.md", "**/*.md"]
